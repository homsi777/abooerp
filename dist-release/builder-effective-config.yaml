directories:
  output: dist-release
  buildResources: build
appId: com.abualmahmoud.logistics
productName: شركة عبو المحمود لنقل والخدمات الوجستية
asar: true
files:
  - filter:
      - dist/**/*
      - dist-electron/**/*
      - package.json
      - config/runtime.json
extraResources:
  - from: dist-server/server.cjs
    to: server.cjs
  - from: dist-server/server-wrapper.cjs
    to: server-wrapper.cjs
  - from: server/src/db/migrations
    to: migrations
    filter:
      - '**/*.sql'
  - from: server/.env
    to: app-config.env
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: شركة عبو المحمود لنقل والخدمات الوجستية
  deleteAppDataOnUninstall: true
electronVersion: 41.2.2
